name: Gerar cards JPEG
on:
  push:
    paths:
      - 'conteudos/*.json'
      - '.github/workflows/gerar-cards.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow
      - name: Gerar imagens JPG
        run: python scripts/gerar_cards.py
      - name: Publicar imagens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imagens/
          if ! git diff --cached --quiet; then
            git commit -m "Gerar cards JPG automaticamente"
            git push
          fi
